name: Build LibWrt AP8220
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 扩容磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
      - name: 克隆LibWrt源码
        run: git clone https://github.com/LiBwrt/LibWrt openwrt --branch 25.12-nss
      - name: 拷贝.config配置文件
        run: cp .config openwrt/.config
      - name: 更新feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 下载dl源码包
        working-directory: ./openwrt
        run: make download -j$(nproc)
      - name: 编译固件
        working-directory: ./openwrt
        run: make -j$(nproc) V=s
      - name: 上传固件Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-AP8220-Firmware
          path: openwrt/bin/targets/ipq807x/generic/
