name: Build LibWrt AP8220
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Build OpenWrt
        uses: breeze303/openwrt-ci@main
        with:
          REPO_URL: https://github.com/LiBwrt/LibWrt
          REPO_BRANCH: 25.12-nss
          TARGET: ipq807x
          SUBTARGET: generic
          PROFILE: alibaba_ap8220
          SSH: true
